version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting CivicLens build..."
      - echo "Checking CivicLens files..."
      - test -f civiclens_citizen.html
      - test -f civiclens_admin.html
      - echo "Both CivicLens HTML files found"

  build:
    commands:
      - echo "Building CivicLens..."
      - echo "Static HTML project - no compilation required"

  post_build:
    commands:
      - echo "CivicLens build completed successfully"

artifacts:
  files:
    - civiclens_citizen.html
    - civiclens_admin.html
